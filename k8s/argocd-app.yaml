apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: campus-help-desk-app
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/harshalchikhale13/Campus-Help-Desk.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: campus-help-desk
  syncPolicy:
    automated:
      prune: true     # Automatically delete things if removed from Git
      selfHeal: true  # Automatically fix deviations (if someone edits live cluster)
    syncOptions:
    - CreateNamespace=true
