apiVersion: v1
kind: Namespace
metadata:
  name: campus-help-desk

---
# Backend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: campus-help-desk
spec:
  replicas: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        # Note: Replace this with your actual Amazon ECR / GitLab Registry image URL
        image: <YOUR_REGISTRY_URL>/campus-help-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: backend-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10

---
# Backend Service (Publicly exposes the backend API)
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: campus-help-desk
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000

---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: campus-help-desk
spec:
  replicas: 2
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        # Note: Replace this with your actual Amazon ECR / GitLab Registry image URL
        image: <YOUR_REGISTRY_URL>/campus-help-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80

---
# Frontend LoadBalancer Service (Exposes app to the internet)
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: campus-help-desk
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
