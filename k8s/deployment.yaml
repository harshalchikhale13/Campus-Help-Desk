apiVersion: v1
kind: Namespace
metadata:
  name: campus-help-desk

---
# -----------------------------------
# Backend Canary Rollout
# -----------------------------------
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: backend
  namespace: campus-help-desk
spec:
  replicas: 3
  strategy:
    canary:
      steps:
      # Step 1: Send 33% of public traffic to the new Green pod (1 Green Pod, 2 Blue Pods)
      - setWeight: 33
      # Step 2: Pause the deployment physically so you can test if users complain. You must click Promote!
      - pause: {}
      # Step 3: Shift traffic to 66% (2 Green Pods, 1 Blue Pod)
      - setWeight: 66
      # Step 4: Automatically wait 60 seconds to monitor it, then naturally proceed to 100%
      - pause: {duration: 60s}
      - setWeight: 100 
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
      - name: backend
        # Note: Replace this with your actual Amazon ECR / GitLab Registry image URL
        image: 378780514304.dkr.ecr.ap-south-1.amazonaws.com/campus-backend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 5000
        envFrom:
        - secretRef:
            name: backend-secrets
        livenessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /health
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10

---
# Core Backend Service (Live Production Traffic)
apiVersion: v1
kind: Service
metadata:
  name: backend-service
  namespace: campus-help-desk
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000

---
# Preview Backend Service (For testing Green before promotion)
apiVersion: v1
kind: Service
metadata:
  name: backend-preview
  namespace: campus-help-desk
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000

---
# Frontend Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: campus-help-desk
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
      - name: frontend
        # Note: Replace this with your actual Amazon ECR / GitLab Registry image URL
        image: 378780514304.dkr.ecr.ap-south-1.amazonaws.com/campus-frontend:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80

---
# Frontend LoadBalancer Service (Exposes app to the internet)
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: campus-help-desk
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
